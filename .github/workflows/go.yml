name: Go 门禁

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: ubuntu-24.04
            arch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 测试
        run: go test ./...
      - name: 竞态检查
        if: matrix.arch == 'amd64'
        run: go test -race ./...
      - name: 静态检查
        run: go vet ./...
      - name: 差异检查
        run: git diff --check
